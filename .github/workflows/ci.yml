name: CI (Tests & Build)

on:
  push:
    branches-ignore:
      - main
      # Inhalts-Branches der Pages-Seite enthalten keinen Quellcode.
      - pages-content
      - gh-pages
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Datenintegritäts- und Unit-Tests
        run: npm test

      - name: Produktions-Build (inkl. Typecheck)
        run: npm run build
