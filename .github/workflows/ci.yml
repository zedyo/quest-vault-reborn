name: CI (Tests & Build)

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
      # Inhalts-Branches der Pages-Seite enthalten keinen Quellcode.
      - pages-content
      - gh-pages
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Datenintegritäts- und Unit-Tests
        run: npm test

      - name: Produktions-Build (inkl. Typecheck)
        run: npm run build
