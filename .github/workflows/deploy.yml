name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Nur EIN Pages-Deployment gleichzeitig. `cancel-in-progress: false` ist für
# Deployment-Workflows die dokumentierte Empfehlung: ein bereits laufendes
# Deployment darf fertig werden, statt mittendrin abgebrochen zu werden.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Datenintegritäts- und Unit-Tests
        run: npm test

      - name: Produktions-Build erstellen
        run: npm run build

      # HINWEIS: Hier stand bis v1.8.1 zusätzlich ein `peaceiris/actions-gh-pages`-Schritt,
      # der `dist/` in den `gh-pages`-Branch gepusht hat. Dieser Push löste GitHubs
      # eingebauten `pages-build-deployment`-Workflow aus, der PARALLEL zum Job `deploy`
      # unten ein zweites Pages-Deployment anlegen wollte. Beide Wege rannten gegeneinander;
      # der Verlierer brach mit HTTP 400 ab ("due to in progress deployment. Please cancel
      # ... first or wait for it to complete"). Der Branch-Weg ist entfernt — es bleibt der
      # Artefakt-Weg (configure-pages -> upload-pages-artifact -> deploy-pages).

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v4

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
